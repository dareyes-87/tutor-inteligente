services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # 5433 en el host: el 5432 lo ocupa otro proyecto local. El backend usa la red interna.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  chroma:
    # Fijada: combinación probada con el cliente chromadb==1.5.9 (requirements.txt).
    # Ojo: `chroma --version` dentro del contenedor dice 1.4.4 (versión del CLI), no de la imagen.
    image: chromadb/chroma:1.5.9
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    ports:
      - "8010:8000"
    volumes:
      - chromadata:/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app:z
      - books:/data/books
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  chromadata:
  books:
